spring.application.name=JWT_Nimbus
server.port=8005

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jwt_nimbus}?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Khanh12345@}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# JWT (HS256 needs at least 32 bytes). Override JWT_SECRET outside development.
security.jwt.secret=${JWT_SECRET:jwt-nimbus-demo-secret-key-2026-at-least-32-bytes}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}
security.jwt.issuer=${JWT_ISSUER:jwt-nimbus}

spring.thymeleaf.cache=false
