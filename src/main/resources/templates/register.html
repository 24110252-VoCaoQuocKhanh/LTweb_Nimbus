<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - JWT Demo</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="register">
<main class="auth-shell">
    <section class="card">
        <p class="eyebrow">Tạo người dùng MySQL</p>
        <h1>Đăng ký tài khoản</h1>
        <p class="subtitle">Mật khẩu được băm BCrypt trước khi lưu vào cơ sở dữ liệu.</p>

        <form id="registerForm" novalidate>
            <label>Họ và tên
                <input id="fullName" name="fullName" type="text" autocomplete="name" required
                       placeholder="Nguyễn Văn A">
            </label>
            <label>Email
                <input id="email" name="email" type="email" autocomplete="email" required
                       placeholder="ban@example.com">
            </label>
            <label>Mật khẩu
                <input id="password" name="password" type="password" autocomplete="new-password" required
                       minlength="6" placeholder="Tối thiểu 6 ký tự">
            </label>
            <button type="submit">Tạo tài khoản</button>
        </form>
        <div id="message" class="message" aria-live="polite"></div>
        <p class="switch-link">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </section>
</main>
<script src="/js/main.js"></script>
</body>
</html>
