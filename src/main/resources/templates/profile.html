<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ - JWT Demo</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="profile">
<main class="profile-shell">
    <header class="topbar">
        <div>
            <p class="eyebrow">Bearer token hợp lệ</p>
            <h1>Hồ sơ người dùng</h1>
        </div>
        <button id="logoutButton" class="secondary" type="button">Đăng xuất</button>
    </header>

    <section class="profile-grid">
        <article class="card">
            <h2>Tài khoản hiện tại</h2>
            <div id="profile" class="details muted">Đang tải...</div>
        </article>
        <article class="card">
            <div class="section-heading">
                <h2>Danh sách người dùng</h2>
                <button id="reloadUsers" class="small" type="button">Tải lại</button>
            </div>
            <div id="users" class="table-wrap muted">Đang tải...</div>
        </article>
    </section>
    <div id="message" class="message" aria-live="polite"></div>
</main>
<script src="/js/main.js?v=2"></script>
</body>
</html>
